findings:
- >-
  Zero SDKs for a payments API is unusual and is the clearest developer-experience gap on this
  provider. A consumer integrating money movement writes their own HTTP client from the
  OpenAPI - which, to be fair, is complete enough to generate one from.
- >-
  Because the OpenAPI is served anonymously and parses cleanly, generated clients are viable
  today even though no first-party ones exist.
