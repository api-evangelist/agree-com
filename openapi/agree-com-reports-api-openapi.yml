components:
  schemas:
    Unauthorized:
      description: Authentication required or invalid credentials
      example:
        error: Invalid or missing API key
      properties:
        error:
          description: Error message
          type: string
      title: Unauthorized
      type: object
    ReportListDataResponse:
      description: Report data payload containing a list
      properties:
        data:
          description: List of report records
          items:
            additionalProperties: true
            type: object
          type: array
      required:
      - data
      title: ReportListDataResponse
      type: object
    ReportDataResponse:
      description: Report data payload
      properties:
        data:
          additionalProperties: true
          description: Report-specific payload
          type: object
      required:
      - data
      title: ReportDataResponse
      type: object
  securitySchemes:
    bearer:
      description: API key authentication via Bearer token
      scheme: bearer
      type: http
