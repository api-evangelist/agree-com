openapi: 3.2.0
info:
  description: '# Introduction


    Welcome to the Agree API!'
  title: Agree Invoices API
  version: 1.0.0
servers:
- url: https://secure.agree.com
  variables: {}
security: []
tags:
- description: Create, send, and track payment requests to your customers.
  name: Invoices
paths:
  /api/v1/invoices/{id}/receipt_pdf:
    get:
      callbacks: {}
      description: 'Returns a presigned URL to download the payment receipt PDF for a **paid** invoice

        (same as the Agree app invoice menu). Returns 422 if the invoice is not paid.'
      operationId: AgreeWeb.API.V1.InvoiceController.receipt_pdf
      parameters:
      - description: Invoice ID (UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedDownloadResponse'
          description: Presigned download URL
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Receipt PDF not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: Invoice not paid
      security:
      - bearer: []
      summary: Download receipt PDF
      tags:
      - Invoices
  /api/v1/invoices/{id}/mark_as_sent:
    post:
      callbacks: {}
      description: Marks an invoice as sent. Optional sent_at (YYYY-MM-DD) picks the org-local calendar day; the server stores a UTC time in org business hours.
      operationId: AgreeWeb.API.V1.InvoiceController.mark_as_sent
      parameters:
      - description: Invoice ID (UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                sent_at:
                  description: Calendar day to record as sent (YYYY-MM-DD). Stored at a randomized business-hours time in the organization timezone.
                  format: date
                  type: string
              type: object
        description: Mark as sent params
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
          description: Invoice marked as sent
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not found
      security:
      - bearer: []
      summary: Mark invoice as sent
      tags:
      - Invoices
  /api/v1/invoices/{id}/send:
    post:
      callbacks: {}
      description: 'Sends an invoice to its recipient. Schedules the invoice for sending via the invoice scheduler,

        which will send email notifications to the recipient.'
      operationId: AgreeWeb.API.V1.InvoiceController.send
      parameters:
      - description: Invoice ID (UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
          description: Invoice sent
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not found
      security:
      - bearer: []
      summary: Send invoice
      tags:
      - Invoices
  /api/v1/invoices:
    get:
      callbacks: {}
      description: Returns a paginated list of invoices for the authenticated organization.
      operationId: AgreeWeb.API.V1.InvoiceController.index
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: 'Items per page (default: 10)'
        in: query
        name: page_size
        required: false
        schema:
          type: integer
      - description: 'Start date for filtering (ISO8601 format: YYYY-MM-DD)'
        in: query
        name: date_start
        required: false
        schema:
          type: string
      - description: 'End date for filtering (ISO8601 format: YYYY-MM-DD)'
        in: query
        name: date_end
        required: false
        schema:
          type: string
      - description: 'Date field to filter by. Valid values: paid_at, due_at, scheduled_at (default: scheduled_at)'
        in: query
        name: date_type
        required: false
        schema:
          type: string
      - description: 'Timezone for date filtering (default: Etc/UTC)'
        in: query
        name: date_timezone
        required: false
        schema:
          type: string
      - description: 'Filter by invoice statuses (comma-separated). Valid values: created, due, sent, canceled, paid, failed, refunded, draft'
        in: query
        name: statuses
        required: false
        schema:
          type: string
      - description: Minimum invoice amount (in dollars)
        in: query
        name: amount_min
        required: false
        schema:
          type: number
      - description: Maximum invoice amount (in dollars)
        in: query
        name: amount_max
        required: false
        schema:
          type: number
      - description: Filter by customer/company name (fuzzy search)
        in: query
        name: customer
        required: false
        schema:
          type: string
      - description: Include draft invoices (invoice templates without invoices)
        in: query
        name: include_drafts
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicesResponse'
          description: Invoices list
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
      security:
      - bearer: []
      summary: List invoices
      tags:
      - Invoices
    post:
      callbacks: {}
      description: 'Creates a new invoice for the authenticated organization.


        Amounts are integers in the smallest currency unit (cents for USD), NOT dollars. A $150 invoice is `{"amount": 15000, "currency": "USD"}`. Multiply dollar amounts by 100.


        Required fields:

        - `due_at` - Payment due date (ISO8601 format, UTC)

        - `scheduled_at` - When to send the invoice (ISO8601 format, UTC)


        You can optionally provide:

        - `recurring_options` to configure recurring settings. If not provided, the invoice will have no recurring schedule (schedule: "none").


        You can optionally provide one of:

        - `billing_contact` with `email` and `name` (and optionally `company` and `title`) to automatically create or update a contact

        - `contact_id` to reference an existing contact

        - `customer_id` to bill an existing customer (business entity); the recipient is the customer''s primary contact. Requires the `customers` feature to be enabled for the organization — discover ids via the customers endpoints.


        All will set the invoice''s `billing_contact` automatically. They are mutually exclusive.'
      operationId: AgreeWeb.API.V1.InvoiceController.create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceParams'
        description: Invoice params
        required: false
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
          description: Invoice created
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Validation errors
      security:
      - bearer: []
      summary: Create invoice
      tags:
      - Invoices
  /api/v1/invoices/{id}/pdf:
    get:
      callbacks: {}
      description: 'Returns a presigned URL to download the invoice PDF (same source as the Agree app invoice menu).


        If the PDF is not in storage yet, the server first waits briefly in case another request already

        kicked off generation, then may enqueue generation and waits up to a **short inline budget**

        (default 5 seconds, `invoice_pdf_api_inline_wait_ms`). If the file is still not ready, responds

        with **202 Accepted**, a `Retry-After` header (default 3 seconds, `invoice_pdf_api_retry_after_seconds`),

        and `data.status: "pending"`. **Repeat the same GET** until you receive **200** with `data.url`.'
      operationId: AgreeWeb.API.V1.InvoiceController.pdf
      parameters:
      - description: Invoice ID (UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedDownloadResponse'
          description: Presigned download URL
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePdfPendingResponse'
          description: PDF not ready; retry after Retry-After
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not found
      security:
      - bearer: []
      summary: Download invoice PDF
      tags:
      - Invoices
  /api/v1/invoices/{id}:
    delete:
      callbacks: {}
      description: Deletes an invoice by ID.
      operationId: AgreeWeb.API.V1.InvoiceController.delete
      parameters:
      - description: Invoice ID (UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Invoice deleted
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not found
      security:
      - bearer: []
      summary: Delete invoice
      tags:
      - Invoices
    get:
      callbacks: {}
      description: Returns a single invoice by ID.
      operationId: AgreeWeb.API.V1.InvoiceController.show
      parameters:
      - description: Invoice ID (UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
          description: Invoice
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not found
      security:
      - bearer: []
      summary: Get invoice
      tags:
      - Invoices
    patch:
      callbacks: {}
      description: Updates an existing invoice.
      operationId: AgreeWeb.API.V1.InvoiceController.update(2)
      parameters:
      - description: Invoice ID (UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceParams'
        description: Invoice params
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
          description: Invoice updated
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Validation errors
      security:
      - bearer: []
      summary: Update invoice
      tags:
      - Invoices
      x-operation-id-source: normalized
      x-operation-id-original: AgreeWeb.API.V1.InvoiceController.update (2)
    put:
      callbacks: {}
      description: Updates an existing invoice.
      operationId: AgreeWeb.API.V1.InvoiceController.update
      parameters:
      - description: Invoice ID (UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceParams'
        description: Invoice params
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
          description: Invoice updated
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Validation errors
      security:
      - bearer: []
      summary: Update invoice
      tags:
      - Invoices
  /api/v1/invoices/create_and_send:
    post:
      callbacks: {}
      description: 'Convenience endpoint that creates an invoice and sends it immediately.


        Combines create and send operations in a single request. The invoice will be scheduled for sending

        via the invoice scheduler, which will send email notifications to the recipient.'
      operationId: AgreeWeb.API.V1.InvoiceController.create_and_send
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceParams'
        description: Invoice params
        required: false
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
          description: Invoice created and sent
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Validation errors
      security:
      - bearer: []
      summary: Create and send invoice
      tags:
      - Invoices
  /api/v1/invoices/{id}/mark_as_paid:
    post:
      callbacks: {}
      description: Marks an invoice as paid. Optional paid_at (YYYY-MM-DD) picks the org-local calendar day; the server stores a UTC time in org business hours.
      operationId: AgreeWeb.API.V1.InvoiceController.mark_as_paid
      parameters:
      - description: Invoice ID (UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                paid_at:
                  description: Calendar day to record as paid (YYYY-MM-DD). Stored at a randomized business-hours time in the organization timezone.
                  format: date
                  type: string
                payment_method:
                  description: 'Payment method used (default: manual)'
                  enum:
                  - manual
                  - ach
                  - card
                  - wire
                  type: string
              type: object
        description: Mark as paid params
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
          description: Invoice marked as paid
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not found
      security:
      - bearer: []
      summary: Mark invoice as paid
      tags:
      - Invoices
components:
  schemas:
    BadRequest:
      description: Invalid request parameters
      example:
        error: Invalid page or page_size
      properties:
        error:
          description: Error message
          type: string
      title: BadRequest
      type: object
    InvoiceParams:
      description: 'Parameters for creating or updating an invoice.


        On **create**, the organization comes from the API key and an **invoice template** is created automatically from `recurring_options` (or defaults). Do not send `organization_id` or `invoice_template_id`; they are not API inputs.

        '
      example:
        invoice:
          amount:
            amount: 15000
            currency: USD
          billing_contact:
            company: Acme Corporation
            email: jane@acme.com
            name: Jane Smith
          due_at: '2025-02-15T00:00:00Z'
          memo: Consulting services - January 2025
          payment_methods:
          - card
          - ach
          recurring_options:
            recurring_end_type: never
            repeat_frequency: 1
            repeat_unit: month
            schedule: custom
          scheduled_at: '2025-02-01T00:00:00Z'
      properties:
        invoice:
          properties:
            agreement_id:
              description: Associated agreement
              format: uuid
              type:
              - string
              - 'null'
            amount:
              allOf:
              - $ref: '#/components/schemas/Money'
              description: 'Invoice amount. Required when creating an invoice.


                `amount.amount` is an INTEGER in the smallest currency unit (cents for USD), not dollars. A $150 invoice is `{"amount": 15000, "currency": "USD"}`. If a user says "create a $50 invoice", send `5000`, not `50`.

                '
            automatic_delivery:
              description: Send invoice automatically
              type: boolean
            billing_contact:
              allOf:
              - $ref: '#/components/schemas/BillingContact'
              description: 'Billing contact information. Creates or updates a contact.

                Cannot be used together with contact_id.

                '
            contact_id:
              description: 'ID of an existing contact to use for this invoice.

                Cannot be used together with billing_contact.

                '
              format: uuid
              type:
              - string
              - 'null'
            customer_id:
              description: 'ID of an existing customer (business entity) to bill. The invoice recipient is the customer''s primary contact. Requires the `customers` feature to be enabled for the organization (403 otherwise) — discover ids via the customers endpoints. Cannot be used together with billing_contact or contact_id. Create-only: ignored on update.

                '
              format: uuid
              type:
              - string
              - 'null'
            delivery_method:
              description: Delivery method (e.g., email)
              type: string
            due_at:
              description: 'Payment due date (ISO8601 format, UTC).

                Required when using the `create` endpoint. Optional for `create_and_send` (defaults to current UTC time if not provided).

                '
              format: date-time
              type:
              - string
              - 'null'
            line_items:
              description: Invoice line items
              items:
                properties:
                  description:
                    description: Line item description
                    type: string
                  quantity:
                    description: Quantity
                    type: number
                  unit_price:
                    description: Per-unit price. `amount` is an INTEGER in the smallest currency unit (cents for USD), not dollars. $25.00 = 2500.
                    properties:
                      amount:
                        description: Integer price in the smallest currency unit (cents for USD). $25.00 = 2500, $1.00 = 100. Do NOT pass dollars.
                        type: integer
                      currency:
                        description: ISO 4217 currency code
                        example: USD
                        type: string
                    type: object
                type: object
              type: array
            memo:
              description: Invoice memo
              maxLength: 255
              type:
              - string
              - 'null'
            payment_methods:
              description: Accepted payment methods
              items:
                enum:
                - ach
                - card
                - wire
                type: string
              type: array
            payment_type:
              description: Type of payment
              enum:
              - invoice
              - payment
              - subscription
              type: string
            recurring_options:
              allOf:
              - $ref: '#/components/schemas/RecurringOptions'
              description: 'Recurring options for the invoice. Configures how the invoice repeats over time.

                If not provided, the invoice will have no recurring schedule (schedule: "none").

                '
            reviewed_at:
              description: 'When the invoice was reviewed/approved (ISO8601 format, UTC).

                Optional on create — defaults to the time of the API request. Invoices created via the API are

                treated as already reviewed by the calling system, so they appear in default lists and are

                eligible for the scheduler immediately. Pass an explicit value to record an earlier review time,

                or omit to accept the current-time default.

                '
              format: date-time
              type:
              - string
              - 'null'
            sales_tax_percentage:
              description: Sales tax percentage
              type:
              - number
              - 'null'
            scheduled_at:
              description: 'When to send the invoice (ISO8601 format, UTC).

                Required when using the `create` endpoint. For `create_and_send`, this is always set to the current UTC time regardless of the value provided.

                '
              format: date-time
              type:
              - string
              - 'null'
          type: object
      required:
      - invoice
      title: InvoiceParams
      type: object
    PresignedDownloadResponse:
      description: Time-limited URL to download a PDF from object storage
      properties:
        data:
          properties:
            expires_in:
              description: URL lifetime in seconds
              type: integer
            url:
              description: Presigned GET URL; expires after expires_in seconds
              format: uri
              type: string
          required:
          - url
          - expires_in
          type: object
      required:
      - data
      title: PresignedDownloadResponse
      type: object
    InvoiceResponse:
      description: Response containing a single invoice
      properties:
        data:
          $ref: '#/components/schemas/Invoice'
      required:
      - data
      title: InvoiceResponse
      type: object
    BillingContact:
      description: Billing contact information. Creates or updates a contact.
      example:
        company: Acme Corp
        email: customer@example.com
        name: John Doe
        title: Software Engineer
      properties:
        company:
          description: Company name
          type:
          - string
          - 'null'
        email:
          description: Contact email address (required). Creates or gets a contact with this email.
          format: email
          type: string
        name:
          description: Contact name
          type:
          - string
          - 'null'
        title:
          description: Job title
          type:
          - string
          - 'null'
      required:
      - email
      title: BillingContact
      type: object
    InvoicesResponse:
      description: Response containing a list of invoices
      properties:
        data:
          description: List of invoices
          items:
            $ref: '#/components/schemas/Invoice'
          type: array
        pagination:
          description: Pagination information
          properties:
            page:
              description: Current page number
              type: integer
            page_size:
              description: Number of items per page
              type: integer
            total_entries:
              description: Total number of invoices
              type: integer
            total_pages:
              description: Total number of pages
              type: integer
          required:
          - page
          - page_size
          - total_pages
          - total_entries
          type: object
      required:
      - data
      - pagination
      title: InvoicesResponse
      type: object
    RecurringOptions:
      description: 'Recurring invoice options. Configures how the invoice repeats over time.

        '
      example:
        forward_payment_enabled: true
        pass_on_fees_enabled: false
        recurring_end_type: never
        reminder_schedule: none
        repeat_frequency: 1
        repeat_on_day: 15
        repeat_on_type: day_of_month
        repeat_unit: month
        schedule: custom
      properties:
        forward_payment_enabled:
          default: true
          description: Enable forward payment
          type: boolean
        pass_on_fees_enabled:
          default: false
          description: Pass processing fees to the payer at checkout
          type: boolean
