          - 'null'
        recurring_end_date:
          description: End date when recurring_end_type is date
          format: date-time
          type:
          - string
          - 'null'
        recurring_end_type:
          default: never
          description: How the recurring invoice ends
          enum:
          - never
          - date
          - count
          type: string
        reminder_schedule:
          default: none
          description: Reminder schedule
          enum:
          - none
          - daily
          - weekly
          - monthly
          type: string
        repeat_frequency:
          default: 1
          description: How often to repeat (e.g., 1 for every week/month)
          type: integer
        repeat_on_day:
          description: Day of month (1-31) when repeat_on_type is day_of_month
          type:
          - integer
          - 'null'
        repeat_on_type:
