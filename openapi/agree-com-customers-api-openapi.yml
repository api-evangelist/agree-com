openapi: 3.2.0
info:
  description: '# Introduction


    Welcome to the Agree API! Agree is a payments and agreements platform that helps businesses send invoices, collect payments, and manage customer relationships. This API lets you integrate Agree''s capabilities directly into your application. ## What You Can Do


    With the Agree API, you can:


    - **Create and send invoices** to customers with flexible payment options (ACH, credit card, wire transfer)

    - **Manage contacts** in your organization''s address book

    - **Set up recurring invoices** with customizable schedules

    - **Receive real-time notifications** via webhooks when payments are made or invoices change status

    - **Track payment status** and history programmatically


    ## Quick Start


    Here''s how to send your first invoice in three API calls:


    ### 1. Get Your API Key


    Generate an API key in your Agree dashboard under **Settings > API Keys**. Keep this key secure - it provides full access to your organization''s data. ### 2. Create a Contact


    First, add the customer you want to invoice:


    ```bash

    curl -X POST https://api.agree.com/api/v1/contacts \

    -H "Authorization: Bearer YOUR_API_KEY" \

    -H "Content-Type: application/json" \

    -d ''{

    "contact": {

    "name": "Jane Smith",

    "email": "jane@example.com",

    "company": "Acme Corp"

    }

    }''

    ```


    ### 3. Create and Send an Invoice


    Now create and send an invoice for that contact. You can use the convenience endpoint to do both in one request:


    ```bash

    curl -X POST https://api.agree.com/api/v1/invoices/create_and_send \

    -H "Authorization: Bearer YOUR_API_KEY" \

    -H "Content-Type: application/json" \

    -d ''{

    "invoice": {

    "billing_contact": {

    "email": "jane@example.com"

    },

    "amount": {"amount": 10000, "currency": "USD"},

    "payment_methods": ["card", "ach"],

    "due_at": "2025-02-01T00:00:00Z",

    "memo": "Consulting services - January 2025"

    }

    }''

    ```


    The invoice will be created and immediately sent to the customer via email. They''ll receive a payment link where they can pay using their preferred method. **Alternative:** You can also create the invoice first with `POST /api/v1/invoices`, then send it later with `POST /api/v1/invoices/:id/send` if you need to review or modify it before sending. ### 4. Get Notified When They Pay


    Set up a webhook to know when the invoice is paid:


    ```bash

    curl -X POST https://api.agree.com/api/v1/webhook_endpoints \

    -H "Authorization: Bearer YOUR_API_KEY" \

    -H "Content-Type: application/json" \

    -d ''{

    "webhook_endpoint": {

    "url": "https://your-app.com/webhooks/agree",

    "events": ["invoice.paid", "invoice.failed"]

    }

    }''

    ```


    Save the `secret` from the response - you''ll need it to verify webhook signatures. ## How Resources Connect


    Understanding how Agree''s resources relate to each other will help you build effective integrations:


    ```

    Contacts ──────► Invoices ──────► Webhooks

    │ │ │

    │ │ │

    ▼ ▼ ▼

    People you Payment Real-time

    do business requests notifications

    with you send when things

    to contacts happen

    ```


    - **Contacts** are people or companies in your address book. You can create contacts explicitly, or they''re created automatically when you send an invoice to a new email address. - **Invoices** are payment requests sent to contacts. Each invoice has an amount, due date, and accepted payment methods. Invoices progress through a lifecycle from created → sent → paid (or failed/canceled). - **Webhooks** notify your application when invoice events occur. This lets you update your systems in real-time without polling. ## Base URL


    All API requests should be made to:


    ```

    https://api.agree.com/api/v1

    ```


    ## Authentication


    All endpoints require Bearer token authentication. Include your API key in the Authorization header:


    ```

    Authorization: Bearer YOUR_API_KEY

    ```


    Keep your API key secure. If compromised, regenerate it immediately in your dashboard. ## Request Format


    Send request bodies as JSON with the `Content-Type: application/json` header. ## Response Format


    All successful responses return JSON with a `data` wrapper:


    ```json

    {

    "data": { ...'
  title: Agree Customers API
  version: 1.0.0
servers:
- url: https://secure.agree.com
  variables: {}
security: []
tags:
- name: Customers
paths:
  /api/v1/customers/{id}:
    get:
      callbacks: {}
      description: Returns a single customer, including its primary contact and every linked contact. Requires the `customers` feature for the organization (403 otherwise).
      operationId: AgreeWeb.API.V1.CustomerController.show
      parameters:
      - description: Customer ID (UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: Customer
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not found
      security:
      - bearer: []
      summary: Get customer
      tags:
      - Customers
    patch:
      callbacks: {}
      description: Updates a customer's name/business_type/address and/or promotes a contact to primary via `primary_contact_id`. Billing identity is stable across primary-contact changes. Requires the `customers` feature for the organization (403 otherwise).
      operationId: AgreeWeb.API.V1.CustomerController.update(2)
      parameters:
      - description: Customer ID (UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerParams'
        description: Customer params
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: Customer updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Validation errors
      security:
      - bearer: []
      summary: Update customer
      tags:
      - Customers
      x-operation-id-source: normalized
      x-operation-id-original: AgreeWeb.API.V1.CustomerController.update (2)
    put:
      callbacks: {}
      description: Updates a customer's name/business_type/address and/or promotes a contact to primary via `primary_contact_id`. Billing identity is stable across primary-contact changes. Requires the `customers` feature for the organization (403 otherwise).
      operationId: AgreeWeb.API.V1.CustomerController.update
      parameters:
      - description: Customer ID (UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerParams'
        description: Customer params
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: Customer updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Validation errors
      security:
      - bearer: []
      summary: Update customer
      tags:
      - Customers
  /api/v1/customers:
    get:
      callbacks: {}
      description: Returns a paginated list of customers with their primary contact (the invoice recipient). Use it to discover customer IDs for the invoice endpoints' `customer_id`. Requires the `customers` feature for the organization (403 otherwise).
      operationId: AgreeWeb.API.V1.CustomerController.index
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: page_size
        required: false
        schema:
          type: integer
      - description: Filter by customer name (fuzzy search)
        in: query
        name: name
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomersResponse'
          description: Customers list
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
      security:
      - bearer: []
      summary: List customers
      tags:
      - Customers
    post:
      callbacks: {}
      description: Creates a customer (the business entity billed by invoices) with a primary contact — provide exactly one of `primary_contact` or `contact_id` (see the request schema). The name must be unique within the organization. Requires the `customers` feature for the organization (403 otherwise).
      operationId: AgreeWeb.API.V1.CustomerController.create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerParams'
        description: Customer params
        required: false
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: Customer created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Validation errors
      security:
      - bearer: []
      summary: Create customer
      tags:
      - Customers
components:
  schemas:
    Customer:
      description: The business entity (customer) billed by an invoice. Routing/billing identity is stable across contact changes; the primary contact is the invoice recipient at issue time.
      example:
        business_type: company
        id: 8d1e3859-aef8-4234-97b5-3d4b89b8157c
        name: Acme Corp
        primary_contact:
          email: john@acme.com
          name: John Doe
      properties:
        business_type:
          description: Customer business type
          enum:
          - company
          - individual
          - non_profit
          - government_entity
          type: string
        id:
          description: Customer identifier
          format: uuid
          type: string
        name:
          description: Customer (company) name
          type: string
        primary_contact:
          description: The customer's primary contact (the invoice recipient).
          properties:
            email:
              description: Primary contact email
              format: email
              type:
              - string
              - 'null'
            name:
              description: Primary contact name
              type:
              - string
              - 'null'
          type:
          - object
          - 'null'
      required:
      - id
      - name
      title: Customer
      type: object
    CustomerResponse:
      properties:
        data:
          $ref: '#/components/schemas/Customer'
      required:
      - data
      title: CustomerResponse
      type: object
    NotFound:
      description: Resource not found error
      example:
        error: Not found
      properties:
        error:
          description: Error message
          type: string
      title: NotFound
      type: object
    CustomersResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Customer'
          type: array
        pagination:
          properties:
            page:
              type: integer
            page_size:
              type: integer
            total_entries:
              type: integer
            total_pages:
              type: integer
          required:
          - page
          - page_size
          - total_pages
          - total_entries
          type: object
      required:
      - data
      - pagination
      title: CustomersResponse
      type: object
    Forbidden:
      description: Access denied to the requested resource
      example:
        error: You do not have access to this resource
      properties:
        error:
          description: Error message
          type: string
      title: Forbidden
      type: object
    Error:
      description: Error response with field-specific error messages
      example:
        errors:
          amount:
          - can't be blank
          recurring_options:
          - is invalid
      properties:
        errors:
          additionalProperties:
            items:
              type: string
            type: array
          description: Map of field names to arrays of error messages
          type: object
      title: Error
      type: object
    BadRequest:
      description: Invalid request parameters
      example:
        error: Invalid page or page_size
      properties:
        error:
          description: Error message
          type: string
      title: BadRequest
      type: object
    Unauthorized:
      description: Authentication required or invalid credentials
      example:
        error: Invalid or missing API key
      properties:
        error:
          description: Error message
          type: string
      title: Unauthorized
      type: object
    CustomerParams:
      description: 'Parameters for creating or updating a customer.


        On create, provide exactly one of `primary_contact` (inline contact, created or reused by email) or `contact_id` (an existing contact not linked to another customer); the primary contact is the invoice recipient. On update, all fields are optional and `primary_contact_id` promotes a contact already linked to this customer (or an unlinked one, which gets linked).

        '
      properties:
        customer:
          properties:
            address:
              type:
              - object
              - 'null'
            business_type:
              description: 'Default: company'
              enum:
              - company
              - individual
              - non_profit
              - government_entity
              type: string
            contact_id:
              description: Create-only. Existing contact to link as primary. Mutually exclusive with primary_contact.
              format: uuid
              type:
              - string
              - 'null'
            name:
              description: Customer name, unique within the organization
              type: string
            primary_contact:
              description: Create-only. Contact to create and link as primary. Mutually exclusive with contact_id.
              properties:
                company:
                  type:
                  - string
                  - 'null'
                email:
                  format: email
                  type: string
                name:
                  type: string
                title:
                  type:
                  - string
                  - 'null'
              required:
              - email
              type:
              - object
              - 'null'
            primary_contact_id:
              description: Update-only. Contact to promote to primary.
              format: uuid
              type: string
          required:
          - name
          type: object
      required:
      - customer
      title: CustomerParams
      type: object
  securitySchemes:
    bearer:
      description: API key authentication via Bearer token
      scheme: bearer
      type: http
