  detail: >-
    No plan meters API calls and no API-specific pricing is published. The API is not listed as
    a feature of Starter or Growth; only Enterprise names "Custom integrations & API access".
    In practice the API documentation instructs any user to generate a key from Settings >
    API Keys with no tier qualification stated, so whether API access is genuinely gated to
    Enterprise is ambiguous from public material. Recorded as published, unresolved - not
    guessed either way.
findings:
- >-
  Volume caps, not seats or calls, are the limiting dimension. A consumer choosing a tier is
  choosing an annual payment-volume ceiling.
- >-
  The business model is the story here: free unlimited e-signature is the acquisition product
  and the 3.5% card / 0.8% ACH take on money movement is the revenue. This is why the company
  positions against DocuSign and Bill.com simultaneously.
