apis:
- aid: agree-com:agree-api
  name: Agree API
  description: >-
    REST API for the Agree contract-to-cash platform. 56 operations across six resources:
    Agreements (create from templates, assign signature fields to recipients, send, fetch
    executed PDFs, soft delete), Invoices (create, create-and-send in one call, recurring
    schedules, mark as sent or paid, invoice and receipt PDFs), Contacts and Customers
    (address book, soft delete), Reports (cash-flow stats and forecast, revenue by customer
    and MRR, recovery aging and leakage analysis), and Webhooks (endpoint registration with
    HMAC-SHA256 signed delivery over twelve event types). Authentication is a bearer API key
    issued from Settings > API Keys in the dashboard. Responses are wrapped in a data envelope
    with page/page_size pagination; validation failures return a field-keyed errors object
    rather than RFC 9457 problem+json.
  humanURL: https://secure.agree.com/documentation
  baseURL: https://secure.agree.com/api/v1
