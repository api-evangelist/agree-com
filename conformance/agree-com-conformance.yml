domain_standards:
  market: Electronic signature and agreement execution
  candidates_probed:
  - id: esign-ueta
    name: US ESIGN Act / UETA electronic signature validity
    declared_in_contract: false
    detail: >-
      REWARD-ONLY CHECK, NOT MET. The Agreement and Recipient schemas carry signing_order,
      current_signing_order, field_values, signed and executed states - a complete e-signature
      data model - but nothing in the contract declares conformance to ESIGN or UETA: no
      audit-trail or certificate-of-completion resource, no tamper-evidence hash, no
      consent-to-electronic-records artifact, and no signer-authentication assertion is
      exposed through the API. The Terms of Service contain the consumer-facing consent
      clause ("YOU HEREBY AGREE TO THE USE OF ELECTRONIC SIGNATURES, CONTRACTS, ORDERS, AND
      OTHER RECORDS"), which is a legal formality on the website rather than a machine-readable
      conformance signal in the contract.
    evidence: https://agree.com/terms
  - id: eidas
    name: eIDAS (EU) advanced or qualified electronic signature
    declared_in_contract: false
    detail: Not referenced anywhere in the contract, documentation, or terms.
    evidence: https://agree.com/terms
  - id: iso20022
    name: ISO 20022 payment messaging
    declared_in_contract: false
    detail: >-
      Payments are modelled as a simple amount/currency minor-unit object with a
      payment_methods enum of card, ach and wire. No ISO 20022 message type, no pain/pacs
      identifiers, and no remittance-information structure.
    evidence: openapi/_original/agree-com-api-openapi-original.json
  - id: x12-edi
    name: ANSI X12 810 invoice / EDI
    declared_in_contract: false
    detail: No EDI shape is offered. Invoices are a proprietary JSON resource.
