name: Agree.com Standards Conformance
description: >-
  Agree.com's conformance profile is lopsided in an interesting way. Its agent-facing
  authorization stack is genuinely standards-conformant - RFC 8414, RFC 9728, RFC 7591,
  RFC 7009 and PKCE are all implemented correctly and were verified by probe. Its REST API
  adopts almost no cross-cutting standards, and the company publishes no security or privacy
  certifications at all.
conformance:
- id: oauth2
  name: OAuth 2.0 / 2.1 Authorization Framework (RFC 6749 / draft-ietf-oauth-v2-1)
  conforms: true
  evidence: https://secure.agree.com/.well-known/oauth-authorization-server
  detail: >-
    Authorization code grant with refresh tokens, response_type code only, and mandatory PKCE
    - the OAuth 2.1 profile. Implicit and password grants are absent, which is the correct
    2.1 posture.
  method: probed
- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
  conforms: true
  evidence: https://secure.agree.com/.well-known/oauth-authorization-server
  detail: >-
    Served at the registered well-known path, HTTP 200, valid JSON, carrying issuer,
    authorization_endpoint, token_endpoint, registration_endpoint, revocation_endpoint,
    grant_types_supported, response_types_supported, code_challenge_methods_supported,
    token_endpoint_auth_methods_supported, scopes_supported and op_policy_uri.
  method: probed
- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata (RFC 9728)
  conforms: true
  evidence: https://secure.agree.com/.well-known/oauth-protected-resource
  detail: >-
    Served at the registered well-known path with resource, authorization_servers,
    bearer_methods_supported, resource_documentation and resource_policy_uri. Critically, the
    401 from the protected resource itself carries the RFC 9728 WWW-Authenticate challenge
    with a resource_metadata parameter - 'Bearer realm="mcp",
    resource_metadata="https://secure.agree.com/.well-known/oauth-protected-resource"' - which
    is the discovery loop the MCP authorization specification requires and which most gated
    MCP endpoints in this catalog omit.
  method: probed
- id: rfc7636
  name: PKCE (RFC 7636)
  conforms: true
  evidence: https://secure.agree.com/.well-known/oauth-authorization-server
  detail: code_challenge_methods_supported is ["S256"]. The insecure "plain" method is not offered.
  method: probed
- id: rfc7591
  name: OAuth 2.0 Dynamic Client Registration (RFC 7591)
  conforms: true
  evidence: https://secure.agree.com/.well-known/oauth-authorization-server
  detail: >-
    registration_endpoint https://secure.agree.com/oauth/register is advertised. Combined with
    token_endpoint_auth_method "none", this is what allows an arbitrary MCP client to connect
