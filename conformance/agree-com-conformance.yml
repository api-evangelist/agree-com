compliance_certifications:
  published: false
  certifications: []
  trust_center: false
  detail: >-
    NO certifications are published. There is no trust center (trust.agree.com has no DNS
    record, agree.com/trust and agree.com/security both return 404), and neither the Terms of
    Service nor the Privacy Policy claims SOC 2, ISO 27001, PCI DSS, GDPR or CCPA compliance.
    The Terms go further and disclaim regulatory fitness outright: "The Services are not
    tailored to comply with industry-specific regulations (Health Insurance Portability and
    Accountability Act (HIPAA), Federal Information Security Management Act (FISMA), etc.)."
    For a platform that stores executed contracts and moves money by ACH, card and wire, this
    is the most consequential published gap on the record. No Compliance or TrustCenter
    pointer is emitted, because there is nothing to point at.
